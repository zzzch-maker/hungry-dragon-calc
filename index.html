<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배고파용키우기 환산 계산기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; max-width: 480px; margin: 0 auto; background-color: #f9fafb; }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
    input { width: 100%; height: 44px; padding: 8px 12px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16px; }
    button { width: 100%; height: 48px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .result { margin-top: 20px; padding: 16px; background: white; border-radius: 8px; border: 1px solid #e5e7eb; text-align: center; }
    .save-notice { font-size: 12px; color: #16a34a; text-align: center; margin-top: 8px; height: 16px; }
  </style>
</head>
<body>
  <h1>🐉 배고파용키우기 환산 계산기</h1>
  
  <!-- [위치 1] 스탯 입력창들이 자동으로 들어가는 곳 -->
  <div id="stats-form"></div>

  <button onclick="calculate()">환산하기</button>
  <div id="save-msg" class="save-notice"></div>

  <div class="result">
    <h3>환산 전투력 기댓값</h3>
    <p id="output" style="font-size: 24px; font-weight: bold; color: #2563eb;">0</p>
  </div>

  <script>
    // ==========================================
    // [위치 2] 스탯 데이터 정의 (항목 추가 시 여기만 수정!)
    // ==========================================
    const statsData = [
      { id: 'atk', label: '기본 공격력', placeholder: '예: 1000', defaultValue: 0 },
      { id: 'critRate', label: '치명타 확률 (%)', placeholder: '예: 50', defaultValue: 0 },
      { id: 'critDmg', label: '치명타 피해 (%)', placeholder: '예: 150', defaultValue: 0 },
      { id: 'bossDmg', label: '보스 피해량 (%)', placeholder: '예: 20', defaultValue: 0 }
    ];

    // 1. 화면에 입력 폼 생성
    const formContainer = document.getElementById('stats-form');
    statsData.forEach(stat => {
      const group = document.createElement('div');
      group.className = 'input-group';
      group.innerHTML = `
        <label>${stat.label}</label>
        <input type="number" id="${stat.id}" placeholder="${stat.placeholder}" oninput="saveData()">
      `;
      formContainer.appendChild(group);
    });

    // 2. [자동 불러오기] 페이지 접속 시 기기에 저장된 값 복원
    window.onload = function() {
      const saved = localStorage.getItem('hungryDragonStats');
      if (saved) {
        const parsedData = JSON.parse(saved);
        statsData.forEach(stat => {
          if (parsedData[stat.id] !== undefined) {
            document.getElementById(stat.id).value = parsedData[stat.id];
          }
        });
        calculate(); // 불러온 값으로 자동 계산
      }
    };

    // 3. [자동 저장하기] 유저가 값을 입력할 때마다 브라우저에 저장
    function saveData() {
      const values = {};
      statsData.forEach(stat => {
        values[stat.id] = document.getElementById(stat.id).value;
      });
      localStorage.setItem('hungryDragonStats', JSON.stringify(values));
      
      const msg = document.getElementById('save-msg');
      msg.innerText = '✓ 입력값 자동 저장됨';
      setTimeout(() => { msg.innerText = ''; }, 1500);
    }

    // ==========================================
    // [위치 3] 환산 공식 (계산식 변경 시 여기만 수정!)
    // ==========================================
    function calculate() {
      const values = {};
      statsData.forEach(stat => {
        const val = Number(document.getElementById(stat.id).value) || stat.defaultValue;
        values[stat.id] = val;
      });

      // 스탯 변수 추출
      const atk = values.atk;
      const critRate = Math.min(values.critRate, 100) / 100;
      const critDmg = values.critDmg / 100;
      const bossDmg = values.bossDmg / 100;

      // 환산 공식 계산
      const totalPower = Math.floor(atk * (1 + (critRate * critDmg)) * (1 + bossDmg));
      
      // 결과 출력
      document.getElementById('output').innerText = totalPower.toLocaleString();
    }
  </script>
</body>
</html>
