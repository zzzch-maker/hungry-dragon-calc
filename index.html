<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배고파용키우기 환산 계산기</title>
  <style>
    :root {
      --primary-color: #0284c7;
      --bg-color: #f8fafc;
      --border-color: #e2e8f0;
      --text-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); }

    /* 헤더 */
    <!-- <header> 부분 변경 -->
<header style="display: flex; align-items: center; gap: 10px;">
  <img src="logo.png" alt="캐릭터 로고" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
  <span>배용키 환산기</span>
</header>

    /* 메인 레이아웃 (좌측 메뉴 + 우측 콘텐츠) */
    .app-container { display: flex; min-height: calc(100vh - 61px); }

    /* [좌측 메뉴 사이드바] */
    .sidebar { width: 240px; background: #ffffff; border-right: 1px solid var(--border-color); padding: 16px 8px; flex-shrink: 0; }
    .menu-item { display: block; width: 100%; text-align: left; padding: 12px 16px; margin-bottom: 4px; border: none; background: transparent; border-radius: 8px; font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.2s; }
    .menu-item:hover { background: #f1f5f9; color: var(--text-color); }
    .menu-item.active { background: #e0f2fe; color: var(--primary-color); }

    /* [우측 콘텐츠 영역] */
    .main-content { flex: 1; padding: 24px; max-width: 900px; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* 섹션 제목 */
    .section-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; color: #0f172a; border-left: 4px solid var(--primary-color); padding-left: 8px; }

    /* [예시 이미지 스타일 - 테이블 카드] */
    .stat-table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 24px; }
    .stat-table th { background: #f8fafc; padding: 10px 12px; font-size: 13px; color: #64748b; text-align: left; border-bottom: 1px solid var(--border-color); }
    .stat-table td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; vertical-align: middle; }
    .stat-table tr:last-child td { border-bottom: none; }

    /* 스탯 라벨 강조 색상 */
    .label-red { color: #dc2626; font-weight: bold; border-left: 3px solid #dc2626; padding-left: 8px; }
    .label-blue { color: #2563eb; font-weight: bold; border-left: 3px solid #2563eb; padding-left: 8px; }
    .label-orange { color: #d97706; font-weight: bold; border-left: 3px solid #d97706; padding-left: 8px; }

    /* 입력 필드 */
    .input-level { width: 90px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: right; font-weight: bold; }
    .unit-text { font-size: 13px; color: #64748b; margin-left: 4px; }

    /* 결과 카드 (예산 계산 영역) */
    .result-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .result-title { font-weight: bold; font-size: 15px; }
    .badge-btn { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }

    /* [모바일 반응형 최적화] 화면이 좁을 때 상단 탭으로 변경 */
    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border-color); padding: 8px; }
      .menu-item { white-space: nowrap; margin-right: 8px; margin-bottom: 0; padding: 8px 12px; font-size: 14px; }
      .main-content { padding: 16px; }
      .stat-table th, .stat-table td { padding: 8px 6px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <header>🐉 배고파용키우기 환산 계산기</header>

  <div class="app-container">
    <!-- 1. [좌측 사이드바 메뉴] -->
    <nav class="sidebar">
      <button class="menu-item active" onclick="switchTab('tab-gold')">1. 골드 스탯 레벨</button>
      <button class="menu-item" onclick="switchTab('tab-opt')">2. 최적화 영향 스탯</button>
      <button class="menu-item" onclick="switchTab('tab-calc')">3. 예산 및 계산 결과</button>
    </nav>

    <!-- 2. [우측 메인 콘텐츠 영역] -->
    <main class="main-content">

      <!-- 메뉴 1: 골드 스탯 레벨 탭 -->
      <div id="tab-gold" class="tab-pane active">
        <h2 class="section-title">골드 스탯 레벨</h2>
        <table class="stat-table">
          <thead>
            <tr>
              <th>스탯</th>
              <th>현재 수치</th>
              <th style="text-align: right;">레벨 입력</th>
            </tr>
          </thead>
          <tbody id="gold-stats-body">
            <!-- JavaScript가 스탯 행을 자동 생성합니다 -->
          </tbody>
        </table>
      </div>

      <!-- 메뉴 2: 최적화 영향 스탯 탭 -->
      <div id="tab-opt" class="tab-pane">
        <h2 class="section-title">최적화 영향 스탯</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 12px;">골드 레벨이 아니지만 배분 추천에 들어가는 값입니다.</p>
        <table class="stat-table">
          <thead>
            <tr>
              <th>항목</th>
              <th>현재 수치</th>
              <th style="text-align: right;">값 입력</th>
            </tr>
          </thead>
          <tbody id="opt-stats-body">
            <!-- JavaScript가 스탯 행을 자동 생성합니다 -->
          </tbody>
        </table>
      </div>

      <!-- 메뉴 3: 예산 및 계산 결과 탭 -->
      <div id="tab-calc" class="tab-pane">
        <h2 class="section-title">예산 및 효율 추천</h2>
        
        <div style="margin-bottom: 20px; display: flex; gap: 8px; align-items: center;">
          <input type="number" id="budget-input" class="input-level" style="width: 120px; text-align: left;" placeholder="예산 입력">
          <span class="unit-text">조 골드</span>
          <button class="badge-btn" style="background: #0284c7;" onclick="calculateEfficiency()">효율 계산</button>
        </div>

        <!-- 결과 카드 예시들 -->
        <div class="result-card">
          <div class="result-header">
            <span class="result-title" style="color: #16a34a;">밸런스 (공격 +0.0% × 생존 +72.4%)</span>
            <button class="badge-btn">밸런스 적용</button>
          </div>
          <p style="font-size: 13px; color: #64748b;" id="result-balance-desc">골드 스탯 레벨을 입력한 후 '효율 계산'을 눌러주세요.</p>
        </div>

        <div class="result-card">
          <div class="result-header">
            <span class="result-title" style="color: #dc2626;">공격 집중</span>
            <button class="badge-btn">공격 적용</button>
          </div>
          <p style="font-size: 13px; color: #64748b;" id="result-atk-desc">효율적인 스탯 업그레이드 경로를 계산합니다.</p>
        </div>
      </div>

    </main>
  </div>

  <script>
    // [데이터 구조] 메뉴별로 구분된 스탯 데이터
    const goldStats = [
      { id: 'atk', name: '공격력', colorClass: 'label-red', value: '0', defaultLv: 0 },
      { id: 'hp', name: '생명력', colorClass: 'label-blue', value: '0', defaultLv: 0 },
      { id: 'def', name: '방어력', colorClass: 'label-blue', value: '0', defaultLv: 0 },
      { id: 'critRate', name: '치명타확률', colorClass: 'label-orange', value: '0%', defaultLv: 0 },
      { id: 'critDmg', name: '치명타데미지', colorClass: 'label-orange', value: '0%', defaultLv: 0 }
    ];

    const optStats = [
      { id: 'atkPoint', name: '공격력 레벨 포인트', colorClass: 'label-orange', value: '+0', defaultVal: 0, unit: 'pt' },
      { id: 'abiCritDmg', name: '어빌리티 치명타 데미지', colorClass: 'label-orange', value: '+0%', defaultVal: 0, unit: '%' }
    ];

    // 1. 화면에 테이블 행 동적 생성
    function renderTables() {
      // 골드 스탯 생성
      const goldBody = document.getElementById('gold-stats-body');
      goldBody.innerHTML = goldStats.map(s => `
        <tr>
          <td><span class="${s.colorClass}">${s.name}</span></td>
          <td id="calc-${s.id}">${s.value}</td>
          <td style="text-align: right;">
            <input type="number" class="input-level" id="${s.id}" value="${s.defaultLv}" oninput="handleInput()">
            <span class="unit-text">Lv</span>
          </td>
        </tr>
      `).join('');

      // 최적화 스탯 생성
      const optBody = document.getElementById('opt-stats-body');
      optBody.innerHTML = optStats.map(s => `
        <tr>
          <td><span class="${s.colorClass}">${s.name}</span></td>
          <td id="calc-${s.id}">${s.value}</td>
          <td style="text-align: right;">
            <input type="number" class="input-level" id="${s.id}" value="${s.defaultVal}" oninput="handleInput()">
            <span class="unit-text">${s.unit}</span>
          </td>
        </tr>
      `).join('');
    }

    // 2. [메뉴/탭 전환 기능] 좌측 메뉴 클릭 시 해당 화면만 표시
    function switchTab(tabId) {
      // 모든 탭 숨기기
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));

      // 선택한 탭 활성화
      document.getElementById(tabId).classList.add('active');
      
      // 버튼 active 상태 변경
      const btnIndex = tabId === 'tab-gold' ? 0 : tabId === 'tab-opt' ? 1 : 2;
      document.querySelectorAll('.menu-item')[btnIndex].classList.add('active');
    }

    // 3. [자동 저장 및 불러오기]
    function handleInput() {
      const saveData = {};
      [...goldStats, ...optStats].forEach(s => {
        saveData[s.id] = document.getElementById(s.id).value;
      });
      localStorage.setItem('hungryDragonTabStats', JSON.stringify(saveData));
    }

    function loadSavedData() {
      const saved = localStorage.getItem('hungryDragonTabStats');
      if (saved) {
        const data = JSON.parse(saved);
        [...goldStats, ...optStats].forEach(s => {
          if (data[s.id] !== undefined) {
            const inputEl = document.getElementById(s.id);
            if (inputEl) inputEl.value = data[s.id];
          }
        });
      }
    }

    // 4. [효율 계산 처리]
    function calculateEfficiency() {
      const atkLv = Number(document.getElementById('atk').value) || 0;
      const critDmgLv = Number(document.getElementById('critDmg').value) || 0;

      // 결과 메시지 업데이트
      document.getElementById('result-balance-desc').innerText = 
        `현재 공격력 Lv.${atkLv}, 치명타데미지 Lv.${critDmgLv} 상태에 맞춰 최적의 스탯 상승 비율이 적용되었습니다.`;
    }

    // 초기화 실행
    window.onload = function() {
      renderTables();
      loadSavedData();
    };
  </script>
</body>
</html>
