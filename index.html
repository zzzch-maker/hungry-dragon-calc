<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배고파용키우기 환산 계산기</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #22c55e; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .result { margin-top: 20px; padding: 15px; background: #f3f4f6; border-radius: 6px; text-align: center; }
  </style>
</head>
<body>
  <h1>🐉 배고파용키우기 환산 계산기</h1>
  
  <!-- 스탯 입력창들이 JS에 의해 자동으로 들어갈 공간 -->
  <div id="stats-form"></div>

  <button onclick="calculate()">환산하기</button>

  <div class="result">
    <h3>환산 전투력 기댓값</h3>
    <p id="output" style="font-size: 24px; font-weight: bold; color: #2563eb;">0</p>
  </div>

  <script>
    // 1. [데이터 정의] 스탯 항목을 JSON 형태의 배열로 관리합니다.
    // 나중에 스탯이 늘어나면 이 배열에 항목만 추가하면 됩니다.
    const statsData = [
      { id: 'atk', label: '기본 공격력', placeholder: '예: 1000', defaultValue: 0 },
      { id: 'critRate', label: '치명타 확률 (%)', placeholder: '예: 50', defaultValue: 0, max: 100 },
      { id: 'critDmg', label: '치명타 피해 (%)', placeholder: '예: 150', defaultValue: 0 },
      { id: 'bossDmg', label: '보스 피해량 (%)', placeholder: '예: 20', defaultValue: 0 } // 항목 추가 예시
    ];

    // 2. [화면 자동 생성] 데이터 기반으로 HTML 입력 폼을 동적으로 만듭니다.
    const formContainer = document.getElementById('stats-form');
    
    statsData.forEach(stat => {
      const group = document.createElement('div');
      group.className = 'input-group';
      group.innerHTML = `
        <label>${stat.label}</label>
        <input type="number" id="${stat.id}" placeholder="${stat.placeholder}">
      `;
      formContainer.appendChild(group);
    });

    // 3. [연산 처리] 입력된 값들을 모아 계산합니다.
    function calculate() {
      // 모든 입력값을 객체 형태로 수집
      const values = {};
      statsData.forEach(stat => {
        const val = Number(document.getElementById(stat.id).value) || stat.defaultValue;
        values[stat.id] = val;
      });

      // 계산 공식 적용
      const atk = values.atk;
      const critRate = Math.min(values.critRate, 100) / 100;
      const critDmg = values.critDmg / 100;
      const bossDmg = values.bossDmg / 100;

      // 예시 환산 공식: 공격력 * (1 + 크확*크뎀) * (1 + 보스피해)
      const totalPower = Math.floor(atk * (1 + (critRate * critDmg)) * (1 + bossDmg));
      
      document.getElementById('output').innerText = totalPower.toLocaleString();
    }
  </script>
</body>
</html>
